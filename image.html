      <figure class="image-lightbox-figure">
        <!-- Le media (img ou video) est injecté en JS -->
      </figure>

      <button class="image-lightbox-nav image-lightbox-nav--next" type="button" aria-label="Next">›</button>

<script>
document.addEventListener('DOMContentLoaded', () => {

  /* =========================
     HOVER PREVIEW — vidéos dans la grille
     ========================= */
  document.querySelectorAll('.image-item--video').forEach(item => {
    const video = item.querySelector('video');
    if (!video) return;

    item.addEventListener('mouseenter', () => {
      video.currentTime = 0;
      video.play().catch(() => { /* silent */ });
    });

    item.addEventListener('mouseleave', () => {
      video.pause();
      video.currentTime = 0;
    });
  });

  /* =========================
     LIGHTBOX (navigation par section)
     ========================= */
  const lightbox   = document.querySelector('[data-image-lightbox]');
  if (!lightbox) return;

  const figure     = lightbox.querySelector('.image-lightbox-figure');
  const prevBtn    = lightbox.querySelector('.image-lightbox-nav--prev');
  const nextBtn    = lightbox.querySelector('.image-lightbox-nav--next');
  const closeBtn   = lightbox.querySelector('.image-lightbox-close');
  const counterEl  = lightbox.querySelector('.image-lightbox-counter');

  let currentItems = [];
  let currentIndex = 0;

  function isVideoItem(el) {
    return el.classList.contains('image-item--video');
  }

  function buildMediaForItem(item) {
    figure.innerHTML = '';

    if (isVideoItem(item)) {
      const src = item.getAttribute('href');
      const video = document.createElement('video');
      video.className = 'image-lightbox-media';
      video.src = src;
      video.controls = true;
      video.autoplay = true;
      video.playsInline = true;
      figure.appendChild(video);
    } else {
      const src = item.getAttribute('href');
      const img = document.createElement('img');
      img.className = 'image-lightbox-media';
      img.src = src;
      img.alt = '';
      figure.appendChild(img);
    }
  }

  function updateCounter() {
    if (!counterEl) return;
    if (!currentItems.length) {
      counterEl.textContent = '';
      return;
    }
    counterEl.textContent = `${currentIndex + 1} / ${currentItems.length}`;
  }

  function showIndex(index) {
    if (!currentItems.length) return;

    if (index < 0) index = currentItems.length - 1;
    if (index >= currentItems.length) index = 0;

    currentIndex = index;
    buildMediaForItem(currentItems[currentIndex]);
    updateCounter();
  }

  function openLightbox(items, startIndex) {
    currentItems = items;
    currentIndex = startIndex;

    showIndex(currentIndex);

    lightbox.classList.add('is-open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.classList.add('has-image-lightbox-open');
  }

  function closeLightbox() {
    lightbox.classList.remove('is-open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('has-image-lightbox-open');

    const playing = figure.querySelector('video');
    if (playing) {
      playing.pause();
    }

    figure.innerHTML = '';
    currentItems = [];
    currentIndex = 0;
  }

  document.querySelectorAll('.gallery-section').forEach(section => {
    const items = Array.from(section.querySelectorAll('.image-item'));

    items.forEach((item, index) => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        openLightbox(items, index);
      });
    });
  });

  if (prevBtn) {
    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showIndex(currentIndex - 1);
    });
  }

  if (nextBtn) {
    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showIndex(currentIndex + 1);
    });
  }

  if (closeBtn) {
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeLightbox();
    });
  }

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('is-open')) return;

    if (e.key === 'Escape')         closeLightbox();
    else if (e.key === 'ArrowLeft')  showIndex(currentIndex - 1);
    else if (e.key === 'ArrowRight') showIndex(currentIndex + 1);
  });

/* =========================
     VOILE DE FLOU + DÉVOILEMENT CURSEUR
     Un voile flouté recouvre chaque grille, troué à la position du curseur.
     Sur mobile (tactile) la fenêtre est figée au centre (géré en CSS).
     Optimisé : IntersectionObserver + threshold de mouvement.
     ========================= */

  const hasHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  const gridObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-in-view');
      } else {
        entry.target.classList.remove('is-in-view');
      }
    });
  }, {
    rootMargin: '200px 0px 200px 0px'
  });

  document.querySelectorAll('.image-grid').forEach(grid => {
    const veil = document.createElement('div');
    veil.className = 'image-grid__veil';
    grid.appendChild(veil);

    gridObserver.observe(grid);

    if (!hasHover) return;

    let pendingFrame = null;
    let lastX = 0;
    let lastY = 0;
    let committedX = 0;
    let committedY = 0;
    const MOVE_THRESHOLD = 3;

    function updateVeilPosition() {
      pendingFrame = null;

      if (
        Math.abs(lastX - committedX) < MOVE_THRESHOLD &&
        Math.abs(lastY - committedY) < MOVE_THRESHOLD
      ) {
        return;
      }

      committedX = lastX;
      committedY = lastY;
      veil.style.setProperty('--reveal-x', lastX + 'px');
      veil.style.setProperty('--reveal-y', lastY + 'px');
    }

    grid.addEventListener('mousemove', (e) => {
      const rect = grid.getBoundingClientRect();
      lastX = e.clientX - rect.left;
      lastY = e.clientY - rect.top;

      if (!pendingFrame) {
        pendingFrame = requestAnimationFrame(updateVeilPosition);
      }
    });

    grid.addEventListener('mouseleave', () => {
      committedX = -9999;
      committedY = -9999;
      veil.style.setProperty('--reveal-x', '-9999px');
      veil.style.setProperty('--reveal-y', '-9999px');
    });
  });
});
</script>
